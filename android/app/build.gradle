plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.krishn03id.eyesafe'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.krishn03id.eyesafe'
        minSdk 23
        targetSdk 35
        versionCode = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionName '1.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        if (System.getenv('EYESAFE_SIGNING_STORE')) {
            ciRelease {
                storeFile file(System.getenv('EYESAFE_SIGNING_STORE'))
                storePassword System.getenv('EYESAFE_KEY_PASSWORD')
                keyAlias 'eyesafe'
                keyPassword System.getenv('EYESAFE_KEY_PASSWORD')
                storeType 'PKCS12'
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            if (System.getenv('EYESAFE_SIGNING_STORE')) signingConfig signingConfigs.ciRelease
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }

    testOptions {
        animationsDisabled true
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
